services:
  backend:
    build: ./backend
    ports: ["8001:8001"]
    env_file: ./backend/.env.example
    volumes:
      - ./backend:/app/backend
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
